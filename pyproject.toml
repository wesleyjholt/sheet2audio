[project]
name = "sheet2audio"
version = "0.1.0"
description = "Turn a PDF (or image) of sheet music into audio plus a play-along score viewer, using only free/open-source software."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "fonttools>=4.65.0",
    "mido>=1.3.3",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "verovio>=6.3.0",
]

[project.scripts]
sheet2audio = "sheet2audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheet2audio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
