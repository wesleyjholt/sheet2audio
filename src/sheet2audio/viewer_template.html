<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #dedbd4; --accent: #c2410c; --paper: #ffffff; --warn-bg: #fff7e6; --warn-ink: #7a4b00;
    --btn: #1d1d1f; --btn-ink: #ffffff; --chip: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #222226; --ink: #ececef; --muted: #9a9aa2;
      --line: #34343a; --accent: #fb923c; --paper: #fbfaf7; --warn-bg: #3a2e14; --warn-ink: #f5d38a;
      --btn: #ececef; --btn-ink: #17171a; --chip: #2e2e33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --panel: #222226; --ink: #ececef; --muted: #9a9aa2;
    --line: #34343a; --accent: #fb923c; --paper: #fbfaf7; --warn-bg: #3a2e14; --warn-ink: #f5d38a;
    --btn: #ececef; --btn-ink: #17171a; --chip: #2e2e33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .bar { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1 1 100%; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--btn);
    color: var(--btn-ink); font-size: 18px; cursor: pointer; flex: none; touch-action: manipulation; }
  #play:disabled { opacity: .5; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 86px; }
  #seek { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
  label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  select, button.small { font: inherit; font-size: 13px; }
  #status { font-size: 12px; color: var(--muted); flex: 1 1 100%; min-height: 0; }
  #status:empty { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 16px; }
  details.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; margin-bottom: 12px; }
  details.box > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 0 6px; }
  .tracks { display: grid; grid-template-columns: minmax(90px, max-content) 1fr auto; gap: 6px 10px;
    align-items: center; margin-top: 6px; }
  .tracks .name { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }
  .tracks .name input { width: 18px; height: 18px; accent-color: var(--accent); }
  .tracks input[type=range] { width: 100%; accent-color: var(--accent); }
  button.solo { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  button.solo[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .downloads { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .downloads a { color: var(--accent); margin-right: 10px; white-space: nowrap; }
  details.notes { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  details.notes summary { cursor: pointer; font-weight: 600; }
  details.notes ul { margin: 6px 0 2px 18px; padding: 0; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
  .page { background: var(--paper); color: #000; border-radius: 6px; margin: 0 0 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 8px; }
  .page svg { display: block; width: 100%; height: auto; }
  .page g.note { cursor: pointer; }
  .page g.note.playing { fill: var(--accent); color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 16px 32px; }
  @media (min-width: 701px) { h1 { flex: 0 1 auto; max-width: 30%; } #status { flex: 0 1 auto; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title"></h1>
    <button id="play" aria-label="Play">▶</button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
    <label>Speed
      <select id="speed">
        <option value="0.5">50%</option><option value="0.6">60%</option><option value="0.7">70%</option>
        <option value="0.8">80%</option><option value="0.9">90%</option>
        <option value="1" selected>100%</option><option value="1.1">110%</option>
        <option value="1.25">125%</option>
      </select>
    </label>
    <label><input type="checkbox" id="follow" checked> Follow</label>
    <div id="status"></div>
  </div>
</header>
<main>
  <details class="box" id="partsBox" open>
    <summary>Parts</summary>
    <div class="presets">
      <label id="practiceLabel">Practise <select id="practice"><option value="">(all equal)</option></select></label>
      <label id="voiceSoundLabel">Voice sound
        <select id="voiceSound"><option value="52">Choir</option><option value="0">Piano</option></select>
      </label>
      <button class="solo" id="allOn">All on</button>
    </div>
    <div class="tracks" id="tracks"></div>
    <div class="downloads" id="downloads"></div>
  </details>
  <div id="notes"></div>
  <div id="score"></div>
</main>
<footer>Tap a note to jump there. Space bar plays and pauses. Made with Audiveris, Verovio and FluidSynth.</footer>
<script type="application/json" id="data">__DATA__</script>
__SAMPLES_SCRIPT__
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  $("title").textContent = data.title;
  document.title = data.title;

  if (data.notes && data.notes.length) {
    var d = document.createElement("details");
    d.className = "notes";
    var s = document.createElement("summary");
    s.textContent = data.notes.length + " thing" + (data.notes.length > 1 ? "s" : "") +
      " to check (optical music recognition is not perfect)";
    d.appendChild(s);
    var ul = document.createElement("ul");
    data.notes.forEach(function (n) { var li = document.createElement("li"); li.textContent = n; ul.appendChild(li); });
    d.appendChild(ul);
    $("notes").appendChild(d);
  }

  // ------------------------------------------------------------ score pages
  // The original line breaks on wide screens, a re-flowed layout on phones.
  // Both use the same note ids; each movement's ids get its index in front.
  var score = $("score");
  var byId = new Map();
  var active = new Map(); // key -> count of overlapping soundings
  var narrowQuery = window.matchMedia("(max-width: 700px)");
  var layout = null;
  function build() {
    var want = narrowQuery.matches ? "svgs_narrow" : "svgs";
    if (want === layout) return;
    layout = want;
    score.innerHTML = "";
    byId = new Map();
    data.movements.forEach(function (mv, mi) {
      if (data.movements.length > 1) {
        var h = document.createElement("h2");
        h.textContent = mv.title;
        score.appendChild(h);
      }
      (mv[want] && mv[want].length ? mv[want] : mv.svgs).forEach(function (svg) {
        var div = document.createElement("div");
        div.className = "page";
        div.innerHTML = svg;
        div.querySelectorAll("[data-id]").forEach(function (el) {
          var key = mi + ":" + el.getAttribute("data-id");
          el.setAttribute("data-key", key);
          byId.set(key, el);
        });
        score.appendChild(div);
      });
    });
    active.forEach(function (_, key) { paint(key); });
  }

  // ------------------------------------------------------------ parts and levels
  var tracks = data.tracks || [];
  var idTracks = data.id_tracks || {};
  var state = tracks.map(function (t) { return { on: true, vol: t.kind === "voice" ? 1 : 0.8, solo: false }; });
  var voiceProgram = String(data.voice_program != null ? data.voice_program : 52);
  function audible(i) {
    var anySolo = state.some(function (s) { return s.solo; });
    var s = state[i];
    return (anySolo ? s.solo : s.on) && s.vol > 0;
  }
  function level(i) { return audible(i) ? state[i].vol : 0; }
  function lit(key) {
    var ts = idTracks[key];
    return !ts || ts.some(audible);
  }
  function paint(key) {
    var el = byId.get(key);
    if (el) el.classList.toggle("playing", active.has(key) && lit(key));
  }

  // One global, time-sorted event list for the highlighting.
  var events = [];
  var onsetOf = new Map();
  data.movements.forEach(function (mv, mi) {
    mv.timemap.forEach(function (e) {
      var t = e.tstamp + mv.offset_ms;
      var ev = { t: t, on: [], off: [] };
      (e.off || []).forEach(function (id) { ev.off.push(mi + ":" + id); });
      (e.on || []).forEach(function (id) {
        var key = mi + ":" + id;
        ev.on.push(key);
        if (!onsetOf.has(key)) onsetOf.set(key, t);
      });
      if (e.measureOn) {
        var mk = mi + ":" + e.measureOn;
        if (!onsetOf.has(mk)) onsetOf.set(mk, t);
      }
      events.push(ev);
    });
  });
  events.sort(function (a, b) { return a.t - b.t; });

  var idx = 0, lastT = -1;
  function reset() {
    active.forEach(function (_, key) { var el = byId.get(key); if (el) el.classList.remove("playing"); });
    active.clear();
    idx = 0;
  }
  function advance(tms) {
    if (tms < lastT) reset();
    var lead = null;
    while (idx < events.length && events[idx].t <= tms) {
      var ev = events[idx++];
      ev.off.forEach(function (k) {
        var n = (active.get(k) || 0) - 1;
        if (n > 0) active.set(k, n); else { active.delete(k); paint(k); }
      });
      ev.on.forEach(function (k) {
        active.set(k, (active.get(k) || 0) + 1);
        paint(k);
        if (lit(k) && byId.get(k)) lead = byId.get(k);
      });
    }
    lastT = tms;
    if (lead && $("follow").checked) follow(lead);
  }
  function follow(el) {
    var sys = el.closest("g.system") || el;
    var r = sys.getBoundingClientRect();
    var top = document.querySelector("header").getBoundingClientRect().bottom;
    if (r.top < top + 8 || r.bottom > window.innerHeight - 8) {
      window.scrollTo({ top: window.scrollY + r.top - top - 16, behavior: "smooth" });
    }
  }

  // ------------------------------------------------------------ audio engine
  // Every note is played from a sample sheet rendered by FluidSynth, through a
  // gain per part, so parts can be switched and the speed changed without
  // changing the pitch. The song clock drives the highlighting.
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, sheet = null, master = null, partGain = [], loading = null, silent = null;
  var playing = false, rate = 1, pos0 = 0, t0 = 0, ptr = [], timer = null, live = [];
  var total = data.duration_ms || 0;
  var LOOKAHEAD_S = 0.3, TICK_MS = 40;
  var wakeLock = null;

  function now() { return playing ? Math.max(pos0, pos0 + (ctx.currentTime - t0) * 1000 * rate) : pos0; }
  function setStatus(t) { $("status").textContent = t || ""; }

  function ensureAudio() {
    if (loading) return loading;
    try { ctx = new AC({ sampleRate: 32000 }); } catch (e) { ctx = new AC(); }
    master = ctx.createGain();
    master.gain.value = 0.55;
    var comp = ctx.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(ctx.destination);
    partGain = tracks.map(function (_, i) {
      var g = ctx.createGain();
      g.gain.value = level(i);
      g.connect(master);
      return g;
    });
    setStatus("Loading sounds…");
    var src = window.__sheet2audioSamples || data.samples.src;
    loading = fetch(src).then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) {
        return new Promise(function (res, rej) { ctx.decodeAudioData(buf, res, rej); });
      })
      .then(function (b) { sheet = b; setStatus(""); })
      .catch(function (e) { setStatus("Could not load the sounds: " + e); throw e; });
    return loading;
  }
  function unlock() {
    // Must run inside the tap: iPhones only start audio from a user gesture,
    // and a playing <audio> element makes Web Audio ignore the silent switch.
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!silent && data.silent_src) {
      silent = new Audio(data.silent_src);
      silent.loop = true;
      silent.setAttribute("playsinline", "");
    }
    if (silent && silent.paused) {
      var p = silent.play();
      if (p && p.catch) p.catch(function () {});
    }
    if (ctx && ctx.state !== "running") ctx.resume();
  }
  function sampleFor(prog, pitch) {
    var set = data.samples.layout[prog] || data.samples.layout["0"];
    if (!set) return null;
    if (set[pitch]) return [set[pitch], 1];
    for (var d = 1; d <= 12; d++) {
      if (set[pitch - d]) return [set[pitch - d], Math.pow(2, d / 12)];
      if (set[pitch + d]) return [set[pitch + d], Math.pow(2, -d / 12)];
    }
    return null;
  }
  function programOf(i) { return tracks[i].kind === "voice" ? voiceProgram : String(tracks[i].program); }
  function startNote(i, n, fromMs) {
    var s = sampleFor(programOf(i), n[2]);
    if (!s) return;
    var smp = s[0], pr = s[1];
    var startMs = Math.max(n[0], fromMs);
    var dur = (n[1] - startMs) / 1000 / rate;
    if (dur <= 0.005) return;
    var when = Math.max(ctx.currentTime, t0 + (startMs - pos0) / 1000 / rate);
    var into = Math.min((startMs - n[0]) / 1000 / rate * pr, smp[1] - 0.05);
    var loop = smp.length > 2;
    var src = ctx.createBufferSource();
    src.buffer = sheet;
    src.playbackRate.value = pr;
    var env = ctx.createGain();
    env.gain.setValueAtTime(n[3] / 110, when);
    var tau = loop ? 0.1 : 0.06;
    var end = when + dur;
    env.gain.setTargetAtTime(0, end, tau);
    var offset = smp[0] + Math.max(0, into);
    var stopAt = end + 6 * tau;
    if (loop) {
      src.loop = true;
      src.loopStart = smp[2];
      src.loopEnd = smp[3];
    } else {
      stopAt = Math.min(stopAt, when + (smp[0] + smp[1] - offset) / pr);
    }
    src.connect(env);
    env.connect(partGain[i]);
    src.start(when, offset);
    src.stop(Math.max(when + 0.01, stopAt));
    live.push({ src: src, env: env, end: stopAt });
  }
  function lowerBound(ns, ms) {
    var lo = 0, hi = ns.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (ns[mid][0] < ms) lo = mid + 1; else hi = mid; }
    return lo;
  }
  function schedule() {
    if (!playing) return;
    var horizon = now() + LOOKAHEAD_S * 1000 * rate;
    for (var i = 0; i < tracks.length; i++) {
      var ns = tracks[i].notes;
      while (ptr[i] < ns.length && ns[ptr[i]][0] < horizon) {
        startNote(i, ns[ptr[i]], Math.max(ns[ptr[i]][0], now()));
        ptr[i]++;
      }
    }
    var t = ctx.currentTime;
    if (live.length > 400) live = live.filter(function (v) { return v.end > t; });
    if (now() >= total) { pause(); pos0 = 0; seekUI(0); }
  }
  function startAt(ms) {
    pos0 = ms;
    t0 = ctx.currentTime + 0.06;
    playing = true;
    for (var i = 0; i < tracks.length; i++) {
      var ns = tracks[i].notes;
      ptr[i] = lowerBound(ns, ms);
      // Notes already sounding at the start point come in part-way through.
      for (var j = ptr[i] - 1; j >= 0 && ns[j][0] > ms - 60000; j--) {
        if (ns[j][1] > ms + 30) startNote(i, ns[j], ms);
      }
    }
    schedule();
    timer = setInterval(schedule, TICK_MS);
  }
  function silenceAll() {
    var t = ctx ? ctx.currentTime : 0;
    live.forEach(function (v) {
      try {
        v.env.gain.cancelScheduledValues(t);
        v.env.gain.setTargetAtTime(0, t, 0.015);
        v.src.stop(t + 0.08);
      } catch (e) {}
    });
    live = [];
    if (timer) clearInterval(timer);
    timer = null;
  }
  function play() {
    ensureAudio();
    unlock();
    $("play").disabled = true;
    loading.then(function () {
      $("play").disabled = false;
      if (playing) return;
      startAt(pos0 >= total ? 0 : pos0);
      setPlayUI(true);
      requestAnimationFrame(frame);
      try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }, function () {}); } catch (e) {}
    }, function () { $("play").disabled = false; });
  }
  function pause() {
    if (!playing) return;
    pos0 = now();
    playing = false;
    silenceAll();
    setPlayUI(false);
    if (silent) silent.pause();
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function seekTo(ms) {
    ms = Math.max(0, Math.min(total, ms));
    if (playing) { playing = false; silenceAll(); startAt(ms); } else { pos0 = ms; }
    advance(ms);
    seekUI(ms);
  }
  function setRate(r) {
    if (playing) { var p = now(); playing = false; silenceAll(); rate = r; startAt(p); } else rate = r;
  }
  function applyLevels() {
    if (ctx) partGain.forEach(function (g, i) { g.gain.setTargetAtTime(level(i), ctx.currentTime, 0.02); });
    active.forEach(function (_, key) { paint(key); });
  }

  // ------------------------------------------------------------ controls
  function fmt(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }
  var dragging = false;
  function seekUI(ms) {
    if (!dragging) $("seek").value = total ? Math.round(ms / total * 1000) : 0;
    $("time").textContent = fmt(ms) + " / " + fmt(total);
  }
  function setPlayUI(on) { $("play").textContent = on ? "❚❚" : "▶"; $("play").setAttribute("aria-label", on ? "Pause" : "Play"); }
  function frame() {
    var t = now();
    advance(t);
    seekUI(t);
    if (playing) requestAnimationFrame(frame);
  }
  $("play").addEventListener("click", function () { if (playing) pause(); else play(); });
  $("seek").addEventListener("input", function (e) { dragging = true; $("time").textContent = fmt(e.target.value / 1000 * total) + " / " + fmt(total); });
  $("seek").addEventListener("change", function (e) { dragging = false; seekTo(e.target.value / 1000 * total); });
  $("speed").addEventListener("change", function (e) { setRate(parseFloat(e.target.value)); });
  score.addEventListener("click", function (e) {
    var el = e.target.closest("g.note") || e.target.closest("g.measure");
    if (!el) return;
    var key = el.getAttribute("data-key");
    if (key && onsetOf.has(key)) { seekTo(onsetOf.get(key)); if (!playing) play(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && !/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) {
      e.preventDefault();
      if (playing) pause(); else play();
    }
  });

  // Parts panel
  var rows = [];
  var hasVoices = tracks.some(function (t) { return t.kind === "voice"; });
  if (!tracks.length) $("partsBox").style.display = "none";
  if (!hasVoices) { $("voiceSoundLabel").style.display = "none"; $("practiceLabel").style.display = "none"; }
  $("voiceSound").value = voiceProgram;
  tracks.forEach(function (t, i) {
    var name = document.createElement("label");
    name.className = "name";
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    name.appendChild(cb);
    name.appendChild(document.createTextNode(t.name));
    var vol = document.createElement("input");
    vol.type = "range"; vol.min = 0; vol.max = 100; vol.value = Math.round(state[i].vol * 100);
    vol.setAttribute("aria-label", t.name + " volume");
    var solo = document.createElement("button");
    solo.className = "solo"; solo.textContent = "Solo"; solo.setAttribute("aria-pressed", "false");
    cb.addEventListener("change", function () { state[i].on = cb.checked; applyLevels(); });
    vol.addEventListener("input", function () { state[i].vol = vol.value / 100; applyLevels(); });
    solo.addEventListener("click", function () {
      state[i].solo = !state[i].solo;
      solo.setAttribute("aria-pressed", String(state[i].solo));
      applyLevels();
    });
    [name, vol, solo].forEach(function (el) { $("tracks").appendChild(el); });
    rows.push({ cb: cb, vol: vol, solo: solo });
    if (t.kind === "voice") {
      var o = document.createElement("option");
      o.value = String(i); o.textContent = t.name;
      $("practice").appendChild(o);
    }
  });
  function setAll(fn) {
    tracks.forEach(function (t, i) {
      fn(t, i);
      rows[i].cb.checked = state[i].on;
      rows[i].vol.value = Math.round(state[i].vol * 100);
      rows[i].solo.setAttribute("aria-pressed", String(state[i].solo));
    });
    applyLevels();
  }
  $("practice").addEventListener("change", function (e) {
    var p = e.target.value === "" ? -1 : parseInt(e.target.value, 10);
    setAll(function (t, i) {
      state[i].on = true; state[i].solo = false;
      if (p < 0) state[i].vol = t.kind === "voice" ? 1 : 0.8;
      else if (i === p) state[i].vol = 1;
      else state[i].vol = t.kind === "voice" ? 0.25 : 0.5;
    });
  });
  $("allOn").addEventListener("click", function () {
    $("practice").value = "";
    setAll(function (t, i) { state[i].on = true; state[i].solo = false; state[i].vol = t.kind === "voice" ? 1 : 0.8; });
  });
  $("voiceSound").addEventListener("change", function (e) {
    voiceProgram = e.target.value;
    if (playing) { var p = now(); playing = false; silenceAll(); startAt(p); }
  });
  (data.downloads || []).forEach(function (d, k) {
    if (k === 0) $("downloads").appendChild(document.createTextNode("Rehearsal tracks: "));
    var a = document.createElement("a");
    a.href = d.href; a.textContent = d.label; a.setAttribute("download", "");
    $("downloads").appendChild(a);
  });

  build();
  if (narrowQuery.addEventListener) narrowQuery.addEventListener("change", build);
  seekUI(0);
})();
</script>
